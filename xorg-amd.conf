# AMD GPU-backed headless X config — ALTERNATIVE to xorg-headless.conf.
#
# Use this when the TrueNAS host's GPU has a REAL connected display:
#   - an HDMI EDID emulator (dummy plug) in the GPU port, OR
#   - the kernel boot parameter amdgpu.virtual_display=1 (after a reboot).
#
# The dummy driver (default) lets Sunshine capture but lacks DRI3, so
# Vulkan/DXVK (Proton) games crash. This amdgpu config provides DRI3/Present
# so games run — but its virtual outputs must report "connected" (dummy plug /
# kernel param) or Sunshine won't capture it.
#
# Enable it by setting USE_AMDGPU=1 in the container environment.
Section "Device"
    Identifier  "AMD"
    Driver      "amdgpu"
    Option      "VirtualHeads" "2"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "AMD"
    DefaultDepth 24
    SubSection "Display"
        Depth     24
        Modes     "1920x1080"
    EndSubSection
EndSection
