# Headless X server config using the dummy video driver. This provides a
# reliable "connected" display that Sunshine captures and Steam renders on.
# NOTE: the dummy driver lacks DRI3, so Vulkan/DXVK (Proton) games cannot
# present frames here. For GPU-accelerated games, plug a cheap HDMI EDID
# emulator into the host's GPU port and switch this config to the amdgpu
# driver (see xorg-amd.conf / the repo notes).
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Device"
    Identifier  "DummyDevice"
    Driver      "dummy"
    VideoRam    262144
EndSection

Section "Monitor"
    Identifier  "DummyMonitor"
EndSection

Section "Screen"
    Identifier  "DummyScreen"
    Device      "DummyDevice"
    Monitor     "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth     24
        Modes     "1920x1080"
    EndSubSection
EndSection
