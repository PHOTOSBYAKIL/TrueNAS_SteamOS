# Headless X server config using the AMD GPU (amdgpu driver) with a virtual
# head. Unlike the dummy driver, this enables DRI3/Present — required for
# Vulkan/DXVK (Proton) games to present frames. VirtualHeads creates the output;
# the entrypoint forces a 1920x1080 mode on it via xrandr.
Section "Device"
    Identifier  "AMD"
    Driver      "amdgpu"
    Option      "VirtualHeads" "2"
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "AMD"
    DefaultDepth 24
    SubSection "Display"
        Depth     24
        Modes     "1920x1080"
    EndSubSection
EndSection
