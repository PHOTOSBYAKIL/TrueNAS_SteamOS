Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Device"
    Identifier  "DummyDevice"
    Driver      "dummy"
    VideoRam    262144
EndSection

Section "Monitor"
    Identifier  "DummyMonitor"
    # 16:9 and 16:10 modelines so clients get a correct default (no 4:3 crop)
    Modeline "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
    Modeline "1920x1200_60.00" 193.16 1920 2048 2256 2592 1200 1203 1209 1245 -hsync +vsync
EndSection

Section "Screen"
    Identifier  "DummyScreen"
    Device      "DummyDevice"
    Monitor     "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth     24
        Modes     "1920x1080_60.00" "1920x1200_60.00"
    EndSubSection
EndSection
